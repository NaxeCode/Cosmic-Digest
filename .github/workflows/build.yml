name: .NET Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release
    - name: Reproduce the offline briefing lab
      run: |
        dotnet run --no-build -c Release --project tools/BriefingLab -- artifacts/briefing-lab
        diff docs/briefing-lab/index.html artifacts/briefing-lab/index.html
        diff docs/briefing-lab/report.json artifacts/briefing-lab/report.json

    - name: Test allowance reservations
      run: python3 -m unittest discover -s scripts -p "test_*.py"

    - name: Publish
      run: dotnet publish CosmicDigest.csproj --no-build --configuration Release --output ./publish
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: CosmicDigest
        path: ./publish
