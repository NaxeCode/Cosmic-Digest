name: Daily Digest

on:
  schedule:
    # Avoid the top-of-hour queue and preserve local time across DST.
    - cron: '17 8 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESEND_VERIFY_DELIVERY: ${{ vars.RESEND_VERIFY_DELIVERY || 'true' }}
      BRAND_NAME: ${{ vars.BRAND_NAME || 'Stella · Cosmic Digest' }}
      BRAND_AVATAR_URL: ${{ vars.BRAND_AVATAR_URL || 'https://raw.githubusercontent.com/NaxeCode/Cosmic-Digest/main/assets/brand/stella-avatar-128.png' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: main

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release

    - name: Prepare digest without sending
      id: prepare-digest
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        OUTBOX_ENCRYPTION_KEY: ${{ secrets.OUTBOX_ENCRYPTION_KEY }}
        MAIL_TO: ${{ secrets.MAIL_TO }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        FEEDBACK_BASE_URL: ${{ secrets.FEEDBACK_BASE_URL }}
        FEEDBACK_SIGNING_KEY: ${{ secrets.FEEDBACK_SIGNING_KEY }}
        TIMEZONE: ${{ secrets.TIMEZONE }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ENABLE_AI_SUMMARY: ${{ secrets.ENABLE_AI_SUMMARY }}
        DIGEST_PROFILE_B64: ${{ secrets.DIGEST_PROFILE_B64 }}
        PREF_TOPICS: ${{ secrets.PREF_TOPICS }}
        PREF_REGIONS: ${{ secrets.PREF_REGIONS }}
        PREF_KEYWORDS: ${{ secrets.PREF_KEYWORDS }}
        RSS_FEEDS: ${{ secrets.RSS_FEEDS }}
      run: dotnet run --no-build --configuration Release -- --prepare-only

    - name: Persist prepared outbox
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/state.json
        if git diff --staged --quiet; then
          exit 0
        fi
        git commit -m "chore: prepare digest outbox [skip ci]"
        git pull --rebase origin main
        git push origin HEAD:main

    - name: Deliver prepared digest
      id: run-digest
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        OUTBOX_ENCRYPTION_KEY: ${{ secrets.OUTBOX_ENCRYPTION_KEY }}
      run: dotnet run --no-build --configuration Release -- --deliver-pending

    - name: Commit final state
      if: ${{ always() && steps.run-digest.outcome != 'skipped' }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/state.json
        if git diff --staged --quiet; then
          exit 0
        fi
        git commit -m "chore: update state.json [skip ci]"
        git pull --rebase origin main
        git push origin HEAD:main
