<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Inspect a fictional observatory briefing. Compare proposed model outputs, exact source excerpts and measured fallback decisions.">
<title>Briefing lab · Cosmic Digest</title>
<style>:root {
  color-scheme: light;
  --ink: #202238;
  --muted: #545772;
  --line: #d8dae8;
  --paper: #f6f7fc;
  --violet: #5148ab;
  --light: #eae7ff;
  --amber: #8b471b;
  --amber-bg: #ffecd9;
  --green: #146859;
  --green-bg: #daf2e8;
  --navy: #242644;
  font:
    16px/1.5 Geist,
    "Helvetica Neue",
    Arial,
    sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
a {
  color: var(--violet);
}
button,
select {
  font: inherit;
}
button,
select,
a {
  touch-action: manipulation;
}
a:focus-visible,
button:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #7861ce;
  outline-offset: 3px;
}
a:focus-visible:is(header a) {
  outline-color: #daceff;
}
.shell {
  width: min(1200px, calc(100% - 80px));
  margin: auto;
}
.skip {
  position: absolute;
  left: 12px;
  top: -5rem;
  background: white;
  z-index: 5;
  padding: 0.7rem;
}
.skip:focus {
  top: 0.5rem;
}
header {
  background: var(--navy);
  color: #fbf9ff;
}
.mast,
.brand,
.plot figcaption,
.hero,
footer {
  display: flex;
  align-items: center;
}
.mast {
  justify-content: space-between;
  height: 52px;
  border-bottom: 1px solid #555775;
}
.brand {
  gap: 10px;
  font-weight: 680;
  font-size: 15px;
  letter-spacing: -0.03em;
}
.brand i {
  font:
    28px/1 Georgia,
    serif;
  color: #d6cbff;
}
.desk,
.plot figcaption span {
  font-size: 12px;
  color: #d0cee3;
}
.hero {
  justify-content: space-between;
  gap: 5%;
  padding: 28px 0 32px;
}
.hero h1 {
  font:
    500 clamp(48px, 6vw, 82px) / 1.03 "Instrument Serif",
    Georgia,
    serif;
  letter-spacing: -0.063em;
  margin: 0;
}
.hero p {
  font-size: 16px;
  max-width: 52ch;
  color: #e0deef;
  margin: 12px 0 0;
  line-height: 1.55;
}
.plot {
  min-width: 320px;
  width: 36%;
  margin: 0;
  align-self: center;
}
.plot figcaption {
  justify-content: space-between;
  margin-bottom: 11px;
  font-size: 13px;
}
.lane,
.ruler {
  display: grid;
  grid-template-columns: 75px 1fr;
  align-items: center;
  min-height: 22px;
}
.lane small,
.ruler {
  color: #d0cee3;
  font-size: 10px;
}
.track {
  height: 19px;
  border-bottom: 1px solid #73748f;
  position: relative;
  background: repeating-linear-gradient(
    90deg,
    #73748f70 0 1px,
    transparent 1px 33.3333%
  );
}
.point {
  position: absolute;
  bottom: -9px;
  width: 18px;
  height: 18px;
  border-radius: 100%;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
}
.point:before {
  content: "";
  width: 7px;
  height: 7px;
  background: #e1d7ff;
  border: 2px solid #bca5ff;
  border-radius: 100%;
}
.lane:nth-child(2) .point:before {
  background: #ffd28c;
  border-color: #ffb25e;
}
.ruler {
  margin-top: 4px;
}
.ruler div {
  display: flex;
  justify-content: space-between;
}
.ruler span:last-child {
  transform: translateX(24%);
}
nav {
  display: flex;
  gap: 31px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
}
nav a {
  padding: 15px 0 12px;
  text-decoration: none;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: -0.01em;
  font-weight: 630;
  border-bottom: 3px solid transparent;
}
nav a[aria-current] {
  color: var(--violet);
  border-color: var(--violet);
}
h2,
h3,
h4,
p,
figure,
blockquote {
  margin: 0;
}
h2 {
  font-size: clamp(25px, 2.35vw, 35px);
  line-height: 1.13;
  letter-spacing: -0.045em;
}
h3 {
  font-size: 17px;
  letter-spacing: -0.035em;
  line-height: 1.35;
}
h4 {
  font-size: 14px;
  line-height: 1.4;
}
.sub,
.meta,
.intro {
  color: var(--muted);
}
.intro {
  font-size: 15px;
  max-width: 75ch;
  margin: 9px 0 20px;
}
.meta {
  font-size: 12px;
}
.case-layout {
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 34px;
}
.rail {
  padding-right: 18px;
  border-right: 1px solid var(--line);
}
.rail h2 {
  font-size: 20px;
  margin-bottom: 12px;
}
.rail label,
.mobile-case label {
  font-size: 13px;
  font-weight: 600;
  display: block;
}
.rail .filt {
  display: flex;
  align-items: center;
  gap: 8px;
}
.rail select,
.mobile-case select {
  border: 1px solid #c4c6da;
  border-radius: 5px;
  background: white;
  padding: 5px 24px 5px 8px;
  color: var(--ink);
  max-width: 100%;
  font-size: 13px;
}
.case-list {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
}
.case-list li + li {
  margin-top: 2px;
}
.case-list a {
  display: grid;
  grid-template-columns: 8px 1fr;
  gap: 10px;
  align-items: baseline;
  font-size: 13px;
  font-weight: 570;
  line-height: 1.4;
  padding: 9px 8px;
  color: var(--ink);
  text-decoration: none;
  border-radius: 4px;
}
.case-list a:hover {
  background: #eeedf5;
}
.case-list a[aria-current] {
  background: #e5e1fb;
  color: #3a2d7c;
  font-weight: 710;
}
.dot {
  border-radius: 100%;
  height: 7px;
  width: 7px;
  background: var(--violet);
  display: inline-block;
}
.dot.fallback {
  background: #b46a37;
}
.dot.accepted {
  background: #368471;
}
.dot.limit {
  background: #8a5a9d;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  width: fit-content;
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 12px;
  line-height: 1.45;
  font-weight: 670;
  background: var(--light);
  color: #443980;
}
.status.fallback {
  color: var(--amber);
  background: var(--amber-bg);
}
.status.accepted {
  color: var(--green);
  background: var(--green-bg);
}
.status.limit {
  background: #efe4f2;
  color: #70417f;
}
.case-head {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  justify-content: space-between;
}
.case-head .status {
  flex-shrink: 0;
  margin-top: 3px;
}
.mobile-case {
  display: none;
}
.evidence {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
}
.sheet {
  padding: 17px 20px 19px;
  min-width: 0;
}
.sheet + .sheet {
  border-left: 1px solid var(--line);
  background: #fafaff;
}
.sheet h3 {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 13px;
}
.sheet h3:before {
  content: "";
  display: inline-block;
  width: 13px;
  height: 10px;
  border: 1px solid var(--muted);
  border-radius: 2px;
  box-shadow: 3px -3px #e0deef;
}
.sheet h4 {
  font-size: 15px;
  margin-bottom: 3px;
}
.sheet .claim {
  font-size: 16px;
  font-weight: 570;
  line-height: 1.45;
}
.sheet p + p,
.sheet .meta + blockquote {
  margin-top: 9px;
}
blockquote {
  font:
    400 17px/1.45 "Hedvig Letters Serif",
    Georgia,
    serif;
  overflow-wrap: anywhere;
  color: #323149;
}
.proposed {
  border-left: 3px solid #aca2e3;
  background: #f5f3ff;
  padding: 8px 11px;
  margin-top: 7px;
}
.source-ref {
  display: inline-block;
  margin-top: 12px;
  font-size: 13px;
  font-weight: 570;
  text-underline-offset: 3px;
}
.label {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.quote-label {
  margin-top: 10px;
}
mark {
  background: #e4e1fd;
  color: inherit;
}
.decision {
  margin-top: 18px;
  border-left: 4px solid #a26232;
  background: #f9efe6;
  border-radius: 2px 6px 6px 2px;
  padding: 14px 17px;
}
.decision.accepted {
  background: #eaf4ee;
  border-color: #397f65;
}
.decision.limit {
  background: #f0e9f4;
  border-color: #865b94;
}
.decision.empty {
  background: #eeedf7;
  border-color: #756da4;
}
.decision p {
  margin-top: 4px;
  font-size: 14px;
}
.flow-title {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  margin: 23px 0 8px;
}
.route {
  font-size: 13px;
  font-weight: 620;
}
.outcomes {
  list-style: none;
  margin: 0;
  padding: 0;
}
.outcomes li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding: 9px 0;
  font-size: 14px;
}
.outcomes .meta {
  flex-shrink: 0;
}
.outcomes p {
  font-size: 13px;
  margin-top: 3px;
  color: var(--muted);
}
details {
  margin-top: 12px;
}
summary {
  cursor: pointer;
  color: var(--violet);
  font-size: 13px;
  font-weight: 620;
  width: fit-content;
  padding: 4px 0;
}
pre {
  background: #eaeaf2;
  border-radius: 5px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.section-head {
  max-width: 820px;
}
.sources-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(235px, 0.72fr);
  gap: 36px;
}
.timeline {
  list-style: none;
  margin: 0;
  padding: 0;
}
.timeline li {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 12px;
  padding: 15px 0;
  border-top: 1px solid var(--line);
  scroll-margin-top: 20px;
}
.timeline li[aria-current] {
  background: #edeafa;
  border-radius: 5px;
}
.timeline time {
  font-size: 13px;
  font-weight: 650;
  color: var(--violet);
  padding: 2px 0 0 8px;
}
.timeline time small {
  display: block;
  color: var(--muted);
  font-weight: 450;
}
.timeline .meta {
  margin: 3px 0 7px;
}
.timeline blockquote {
  font-size: 16px;
}
.ranking {
  padding: 17px 19px;
  background: #eceaf6;
  border-radius: 6px;
  align-self: start;
}
.ranking ol {
  padding-left: 1.25rem;
  font-size: 14px;
}
.ranking li + li {
  margin-top: 12px;
}
.ranking p {
  font-size: 13px;
}
.ranking .meta {
  display: block;
}
.stats {
  display: flex;
  align-items: baseline;
  gap: 24px;
  flex-wrap: wrap;
  background: #e9e6f8;
  padding: 14px 18px;
  border-left: 4px solid #7668be;
  margin: 12px 0 20px;
}
.stats strong {
  font-size: 22px;
  letter-spacing: -0.04em;
}
.stats span {
  font-size: 13px;
  color: #494365;
}
.stats span strong {
  color: var(--ink);
  margin-right: 4px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
th,
td {
  vertical-align: top;
  text-align: left;
  padding: 11px 8px;
  border-bottom: 1px solid var(--line);
}
th {
  font-size: 12px;
  color: var(--muted);
}
td a {
  font-weight: 570;
  text-underline-offset: 3px;
}
.results-note {
  margin-top: 16px;
  color: var(--muted);
  font-size: 14px;
}
footer {
  margin-top: 38px;
  padding: 16px 0 26px;
  border-top: 1px solid var(--line);
  justify-content: space-between;
  gap: 15px;
  font-size: 12px;
  color: var(--muted);
}
footer span:first-child {
  font-weight: 650;
}
@media (max-width: 880px) {
  .shell {
    width: calc(100% - 44px);
  }
  .case-layout {
    grid-template-columns: 190px minmax(0, 1fr);
    gap: 19px;
  }
  .rail {
    padding-right: 12px;
  }
  .evidence {
    grid-template-columns: 1fr;
  }
  .sheet + .sheet {
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .plot {
    min-width: 265px;
  }
  .sources-grid {
    gap: 18px;
  }
  .case-head {
    display: block;
  }
  .case-head .status {
    margin: 8px 0 0;
  }
  .sheet {
    padding: 14px;
  }
}
@media (max-width: 640px) {
  .shell {
    width: calc(100% - 32px);
  }
  .mast {
    height: 43px;
  }
  .hero {
    display: block;
    padding: 18px 0 23px;
  }
  .hero h1 {
    font-size: 54px;
  }
  .hero p {
    font-size: 14px;
    line-height: 1.45;
    margin-top: 7px;
  }
  .plot {
    display: none;
  }
  nav {
    gap: 20px;
    margin-bottom: 16px;
  }
  nav a {
    font-size: 13px;
    padding: 13px 0 10px;
  }
  .case-layout,
  .sources-grid {
    display: block;
  }
  .rail {
    border: none;
    padding: 0;
    margin: 0 0 16px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 10px;
  }
  .rail h2,
  .case-list {
    display: none;
  }
  .rail .filt,
  .mobile-case {
    display: flex;
    flex-direction: column;
    gap: 3px;
    align-items: stretch;
  }
  .rail label,
  .mobile-case label {
    font-size: 11px;
  }
  .rail select,
  .mobile-case select {
    width: 100%;
    height: 39px;
    font-size: 13px;
    padding-right: 4px;
  }
  .case-head h2 {
    font-size: 26px;
  }
  .intro {
    font-size: 14px;
    margin: 8px 0 13px;
  }
  .sheet {
    padding: 14px;
  }
  .decision {
    margin-top: 12px;
  }
  .timeline li {
    grid-template-columns: 54px 1fr;
    gap: 8px;
  }
  .timeline time {
    padding-left: 2px;
  }
  .ranking {
    margin-top: 15px;
  }
  .stats {
    gap: 10px 16px;
  }
  .stats span strong {
    font-size: 20px;
  }
  th,
  td {
    padding: 8px 4px;
    font-size: 12px;
  }
  .status {
    font-size: 11px;
  }
  footer {
    align-items: flex-start;
    flex-direction: column;
    gap: 3px;
  }
}
.evidence + .evidence {
  margin-top: 9px;
}
.download {
  background: #463c8c;
  color: white;
  border: 0;
  border-radius: 5px;
  padding: 8px 12px;
  margin-top: 12px;
  font-size: 13px;
  cursor: pointer;
}
.download:hover {
  background: #322a71;
}
.stage-readout {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}
</style>
</head>

<script>"use strict";
const report = JSON.parse(document.getElementById("lab-report").textContent);
const content = document.getElementById("content");
const sourceById = new Map(report.reports.map((source) => [source.id, source]));
const caseById = new Map(
  report.cases.map((result) => [result.fixture.id, result]),
);
const format = (options) =>
  new Intl.DateTimeFormat("en-GB", { ...options, timeZone: "UTC" });
const clock = (value) =>
  format({ hour: "2-digit", minute: "2-digit" }).format(new Date(value));
const date = (value) =>
  format({ day: "2-digit", month: "short" }).format(new Date(value));
const escape = (value) =>
  String(value ?? "").replace(
    /[&<>"']/g,
    (character) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        character
      ],
  );
const e = escape;
const caseLink = (result) => "#case/" + encodeURIComponent(result.fixture.id);
const sourceLink = (id) => "#sources/" + encodeURIComponent(id);
const tone = (result) =>
  result.fixture.knownLimit
    ? "limit"
    : { Accepted: "accepted", Fallback: "fallback", "No items": "empty" }[
        result.actual
      ];
const displayStatus = (result) =>
  result.fixture.knownLimit ? "Accepted · known limit" : result.actual;
const status = (result) =>
  `<span class="status ${tone(result)}">${e(displayStatus(result))}</span>`;
let filter = "All cases";
const filters = [
  "All cases",
  "Fallback",
  "Accepted",
  "No items",
  "Known limit",
];
const matchesFilter = (result) =>
  filter === "All cases" ||
  (filter === "Known limit"
    ? result.fixture.knownLimit
    : result.actual === filter);

function drawArrivals() {
  const end = new Date(report.clock).getTime();
  const start = end - 6 * 3600000;
  const recent = report.reports.filter(
    (source) =>
      Date.parse(source.published) >= start &&
      Date.parse(source.published) <= end,
  );
  const lanes = [
    ["Release", ["Release note", "Syndicated report"]],
    ["Operations", ["Operations correction"]],
    ["Other", ["Community notice", "Bench report"]],
  ];
  const marks = (source) => {
    const at = ((Date.parse(source.published) - start) / (end - start)) * 100;
    const label = e(
      `${clock(source.published)} UTC · ${source.kind} · ${source.source}`,
    );
    return `<a class="point" style="left:${at}%" title="${label}" aria-label="${label}" href="${sourceLink(source.id)}"></a>`;
  };
  document.getElementById("arrivals").innerHTML =
    lanes
      .map(
        ([name, kinds]) =>
          `<div class="lane"><small>${name}</small><div class="track">${recent
            .filter((s) => kinds.includes(s.kind))
            .map(marks)
            .join("")}</div></div>`,
      )
      .join("") +
    `<div class="ruler"><i></i><div>${[0, 2, 4, 6].map((h) => `<span>${clock(start + h * 3600000)}</span>`).join("")}</div></div>`;
}

function rail(selected) {
  const options = report.cases.filter(matchesFilter);
  return `<aside class="rail" aria-label="Choose a case"><h2>Case files</h2>
    <div class="filt"><label for="filter">Outcome</label><select id="filter">${filters.map((name) => `<option${name === filter ? " selected" : ""}>${e(name)}</option>`).join("")}</select></div>
    <div class="mobile-case"><label for="choose-case">Case file</label><select id="choose-case">${options
      .map(
        (item) =>
          `<option value="${e(item.fixture.id)}"${item === selected ? " selected" : ""}>${e(item.fixture.title)}</option>`,
      )
      .join("")}</select></div>
    <ul class="case-list">${options
      .map(
        (
          item,
        ) => `<li><a href="${caseLink(item)}" ${item === selected ? 'aria-current="true"' : ""}>
      <i aria-hidden="true" class="dot ${tone(item)}"></i><span>${e(item.fixture.title)}</span></a></li>`,
      )
      .join("")}</ul></aside>`;
}

function highlighted(text, quote) {
  const pos = quote ? text.indexOf(quote) : -1;
  if (pos < 0) return e(text);
  return (
    e(text.slice(0, pos)) +
    "<mark>" +
    e(quote) +
    "</mark>" +
    e(text.slice(pos + quote.length))
  );
}

function evidence(item, result) {
  const rank =
    item && report.candidates.find((c) => c.index === item.article_index);
  const source = rank && sourceById.get(rank.sourceId);
  const claim = item
    ? `<p class="claim">${e(item.what_changed)}</p><p class="label quote-label">Submitted evidence quote</p><blockquote class="proposed">${e(item.evidence_quote)}</blockquote>
       <p class="meta">Article ${e(item.article_index)} · ${e(item.decision)} · ${e(item.confidence)} confidence</p>`
    : `<p class="claim">${e(result.fixture.response.bottom_line)}</p><p class="meta">0 items submitted</p>`;
  let excerpt = `<p class="claim">${item ? "Reference outside the batch" : "No source cited"}</p><p class="meta">${item ? `Article ${e(item.article_index)} exceeds the ${report.candidates.length} ranked candidates.` : "The response selected an empty item list."}</p>`;
  if (source)
    excerpt = `<h4>${e(source.source)}</h4><p class="meta">${clock(source.published)} UTC · Article ${rank.index} · ${e(source.kind)}</p>
    <blockquote>${highlighted(source.summary, item.evidence_quote)}</blockquote><a class="source-ref" href="${sourceLink(source.id)}">Locate report in timeline</a>`;
  return `<div class="evidence"><section class="sheet"><h3>Proposed response</h3>${claim}</section><section class="sheet"><h3>Cited source</h3>${excerpt}</section></div>`;
}

function caseView(result) {
  if (!matchesFilter(result)) filter = "All cases";
  const f = result.fixture;
  const items = f.response.items;
  const pairs = (items.length ? items : [null])
    .map((item) => evidence(item, result))
    .join("");
  let title, reason;
  if (result.error) {
    title = "Validation rejected the response";
    reason = result.error;
  } else if (f.knownLimit) {
    title = "Validation accepted an unsupported claim";
    reason =
      "The excerpt occurs in the cited report. The validator checks quote attribution. It does not test whether the conclusion follows from the quote.";
  } else if (result.actual === "No items") {
    title = "Validation accepted an empty selection";
    reason =
      "The briefing would be suppressed because the validated response has no items.";
  } else {
    title = "Validation accepted the response";
    reason =
      "The submitted items satisfied the quote, article reference and decision checks.";
  }
  const displayed = result.displayed.items
    .map((item) => {
      const candidate = report.candidates[item.article_index - 1];
      const source = sourceById.get(candidate.sourceId);
      return `<li><span class="meta">Art. ${item.article_index}</span><div><strong>${e(source.title)}</strong><p>${e(item.what_changed)}</p></div></li>`;
    })
    .join("");
  content.innerHTML = `<div class="case-layout">${rail(result)}<article>
    <div class="case-head"><h2>${e(f.title)}</h2>${status(result)}</div><p class="intro">${e(f.note)}</p>
    ${pairs}<section class="decision ${tone(result)}"><h3>${e(title)}</h3><p>${e(reason)}</p></section>
    <p class="stage-readout">Structure: ${e(result.structure.toLowerCase())} · Full validation: ${result.error ? "rejected" : "accepted"}</p>
    <div class="flow-title"><h3>${result.actual === "Fallback" ? "Deterministic fallback" : "Validated briefing"}</h3><span class="meta">${result.visible.length} displayed</span></div>
    <p class="sub">${e(result.displayed.bottom_line)}</p><ol class="outcomes">${displayed}</ol>
    <details><summary>Inspect the proposed JSON</summary><pre>${e(JSON.stringify(f.response, null, 2))}</pre></details>
  </article></div>`;
  document.getElementById("filter").addEventListener("change", (event) => {
    filter = event.target.value;
    const current = matchesFilter(result)
      ? result
      : report.cases.find(matchesFilter);
    if (!current) return;
    if (current !== result) history.replaceState(null, "", caseLink(current));
    caseView(current);
    document.getElementById("filter").focus({ preventScroll: true });
  });
  document.getElementById("choose-case").addEventListener("change", (event) => {
    location.hash = caseLink(caseById.get(event.target.value));
  });
}

function sourceView(selected) {
  const entries = [...report.reports].sort(
    (a, b) => Date.parse(a.published) - Date.parse(b.published),
  );
  content.innerHTML = `<div class="section-head"><h2>Source timeline</h2>
    <p class="intro">The announcement and its correction arrived three hours apart. The ranker grouped the syndicated copy with the original and kept the correction as its own event.</p></div>
    <div class="sources-grid"><ol class="timeline">${entries
      .map(
        (source) =>
          `<li id="source-${e(source.id)}" ${source.id === selected ? 'aria-current="true"' : ""}><time datetime="${e(source.published)}">${clock(source.published)}<small>${date(source.published)}</small></time>
       <div><h3>${e(source.title)}</h3><p class="meta">${e(source.source)} · ${e(source.kind)}</p><blockquote>${e(source.summary)}</blockquote></div></li>`,
      )
      .join(
        "",
      )}</ol><aside class="ranking"><h3>Ranked candidates</h3><p>Article numbers come from the C# selector at the fixture clock.</p>
    <ol>${report.candidates.map((candidate) => `<li><strong>${e(sourceById.get(candidate.sourceId).title)}</strong><span class="meta">Score ${candidate.score.toFixed(3)} · ${candidate.publishers} publisher${candidate.publishers === 1 ? "" : "s"}</span></li>`).join("")}</ol>
    <p>A second publisher can repeat one report. Coverage count alone establishes no independent confirmation.</p></aside></div>`;
  const row = selected && document.getElementById("source-" + selected);
  if (row) row.scrollIntoView({ block: "nearest" });
}

function resultsView() {
  const fallback = report.cases.filter((r) => r.actual === "Fallback").length;
  content.innerHTML = `<div class="section-head"><h2>Run results</h2><p class="intro">Each hand-authored response runs through the production validator. An expectation checks the outcome, the rejection reason when applicable, and which reports reach the briefing.</p></div>
    <div class="stats"><span><strong>${report.matched}/${report.cases.length}</strong> expectations matched</span><span><strong>${fallback}</strong> fallbacks</span>
    <span><strong>${report.additionalRejections}</strong> extra rejections from quote checks</span><span><strong>${report.unsupportedAccepted}</strong> unsupported claim accepted</span></div>
    <table><thead><tr><th scope="col">Fixture</th><th scope="col">Structure only</th><th scope="col">Expected</th><th scope="col">Actual</th><th scope="col">Matched</th></tr></thead><tbody>${report.cases
      .map(
        (result) =>
          `<tr><td><a href="${caseLink(result)}">${e(result.fixture.title)}</a></td><td>${e(result.structure)}</td><td>${e(result.fixture.expected)}</td><td>${e(displayStatus(result))}</td><td>${result.matches ? "Yes" : "No"}</td></tr>`,
      )
      .join(
        "",
      )}</tbody></table><p class="results-note">Rank order and publisher counts matched the fixture: ${report.rankMatches ? "yes" : "no"}. These outcomes measure deterministic behavior on this corpus. Live generation quality and semantic accuracy are unmeasured.</p>
    <button id="download" class="download" type="button">Download the C# report</button>`;
  document.getElementById("download").onclick = () => {
    const url = URL.createObjectURL(
      new Blob([JSON.stringify(report, null, 2) + "\n"], {
        type: "application/json",
      }),
    );
    const link = document.createElement("a");
    link.download = "cosmic-digest-report.json";
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
}

function render() {
  const [view, id] = location.hash.slice(1).split("/");
  const current = ["sources", "results"].includes(view) ? view : "case";
  document.querySelectorAll("nav a").forEach((link) => {
    if (link.dataset.view === current)
      link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  if (current === "sources") sourceView(id);
  else if (current === "results") resultsView();
  else caseView(caseById.get(id) ?? report.cases[0]);
}
drawArrivals();
render();
window.addEventListener("hashchange", render);
</script>
</body></html>
